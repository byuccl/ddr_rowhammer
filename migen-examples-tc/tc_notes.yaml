LiteX Rowhammer Tester:
  OpenOCD:
    additional dependencies:
      # apt install
      - libtool
      - libusb-1.0-0-dev
      - pkg-config
  Rowhammer Tester:
    additional dependencies:
      # pip install
      - ninja
    Firewall:
      # Not sure if this was required, but I did this while debugging.
      iptables:
        - iptables -A INPUT -i eno2 -j ACCEPT
        - iptables -A OUTPUT -o eno2 -j ACCEPT
      ufw:
        - ufw enable
        - ufw allow in on eno2 to any
        - ufw allow out on eno2 to any
    Interfaces:
      - Had to disable eno1 to successfully connect.
      - ip link set eno1 down
  Usage:
    # Make Vivado available.
    - source /tools/Xilinx/Vivado/2021.1/settings64.sh
    # Activate python virtual environment.
    - source ./venv/bin/activate
    # Set the target board.
    - export TARGET=arty
    # Build the modules for the board.
    - make build
    # Upload built module to the board.
    - make upload
    # Run the communication server.
    - make srv
    # Run the leds test.
    - python leds.py
